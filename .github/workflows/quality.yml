name: EvolvePHP 2 Quality

on:
  pull_request:
    branches:
      - 2.x
  push:
    branches:
      - 2.x
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_REMOTE_CLIENT_PHP: '7.4'
  UBUNTU_24_04: &ubuntu-24-04 ubuntu-24.04

concurrency:
  group: evolvephp-2-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy (PHP 8.4)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate root Composer manifest and lockfile
        run: composer validate --strict --check-lock

      - name: Install root dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run legacy remote client static analysis
        run: php vendor/bin/phpstan analyse --configuration compat/legacy-http-client/phpstan.neon.dist --memory-limit=1G --no-progress

      - name: Run release package split validation
        run: composer release:split:validate

      - name: Run application skeleton create-project validation
        run: composer release:skeleton:validate

      - name: Run root supply-chain checks
        run: composer supply-chain

      - name: Run root policy tests
        run: php vendor/bin/phpunit --configuration phpunit.xml.dist tests/Architecture tests/Documentation

  benchmark-policy:
    name: Benchmark policy (PHP 8.4)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate benchmark Composer manifest and lockfile
        run: composer validate --working-dir=benchmarks --strict --check-lock

      - name: Install benchmark dependencies
        run: composer install --working-dir=benchmarks --no-interaction --no-progress --prefer-dist

      - name: Run CI-safe benchmark policy checks
        run: composer --working-dir=benchmarks ci:policy

  workspace-quality:
    name: Workspace quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate root Composer manifest and lockfile
        run: composer validate --strict --check-lock

      - name: Install root dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run root quality
        run: composer quality

  legacy-remote-client:
    name: Legacy remote client (PHP 7.4)
    runs-on: *ubuntu-24-04

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build PHP 7.4 legacy client runtime
        run: |
          docker build --build-arg PHP_VERSION="${LEGACY_REMOTE_CLIENT_PHP}" -t evolvephp-legacy-client-php:${LEGACY_REMOTE_CLIENT_PHP} - <<'DOCKERFILE'
          ARG PHP_VERSION
          FROM php:${PHP_VERSION}-cli
          RUN apt-get update \
              && apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config \
              && docker-php-ext-install curl \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Validate legacy remote client Composer manifest
        run: docker run --rm -v "${PWD}:/workspace" -w /workspace composer:2 validate --working-dir=compat/legacy-http-client --strict

      - name: Verify PHP 7.4 legacy client runtime
        run: docker run --rm -v "${PWD}:/workspace" -w /workspace evolvephp-legacy-client-php:${LEGACY_REMOTE_CLIENT_PHP} php -r 'if (PHP_VERSION_ID < 70400 || PHP_VERSION_ID >= 80000 || !extension_loaded("json") || !extension_loaded("curl")) { fwrite(STDERR, "Legacy client runtime must be PHP 7.4 with json and curl enabled.\n"); exit(1); }'

      - name: Run legacy remote client tests
        run: docker run --rm -v "${PWD}:/workspace" -w /workspace evolvephp-legacy-client-php:${LEGACY_REMOTE_CLIENT_PHP} php compat/legacy-http-client/tests/run.php

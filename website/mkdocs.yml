      - Source Preview: next/getting-started/source-preview.md
      - Architecture: next/concepts/architecture.md
      - Execution Model: next/concepts/execution-model.md
      - Service Lifetimes: next/concepts/service-lifetimes.md
      - Modernization: next/modernization/overview.md
      - Audit: next/modernization/audit.md
      - Doctor: next/modernization/doctor.md
      - Adoption Planning: next/modernization/adoption-planning.md
      - Bridge: next/modernization/bridge.md
      - Insight: next/observability/insight.md
      - Observe: next/observability/observe.md
      - Packages: next/packages/overview.md
      - MCP: next/packages/mcp.md
      - Releases: next/project/releases.md
      - RFCs: next/project/rfcs.md
      - Documentation Versioning: next/project/documentation-versioning.md
  - Versions: versions/index.md

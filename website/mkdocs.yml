site_name: EvolvePHP
site_description: EvolvePHP 2 Next developer manual
site_url: https://josiahking.github.io/evolvephp/
repo_url: https://github.com/josiahking/evolvephp
repo_name: josiahking/evolvephp
edit_uri: edit/2.x/website/docs/
docs_dir: docs
site_dir: build
use_directory_urls: true
theme:
